name: CI

on:
  push:
    branches: [main, refactor/modular-bash]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck on all .sh files
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck -x

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh and bats
        run: sudo apt-get update && sudo apt-get install -y zsh bats
      - name: Run bats tests
        run: bats tests/
